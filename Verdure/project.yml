name: Verdure
options:
  bundleIdPrefix: com.verdure
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "16.3"
configFiles:
  Debug: Secrets.xcconfig
  Release: Secrets.xcconfig
settings:
  SWIFT_VERSION: "6.0"
  MARKETING_VERSION: "1.0.0"
  CURRENT_PROJECT_VERSION: "1"
packages:
  Firebase:
    url: https://github.com/firebase/firebase-ios-sdk
    from: "11.0.0"
targets:
  Verdure:
    type: application
    platform: iOS
    sources:
      - Verdure
    info:
      path: Verdure/Info.plist
      properties:
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UILaunchScreen: {}
        UISupportedInterfaceOrientations~iphone:
          - UIInterfaceOrientationPortrait
        UIRequiresFullScreen: true
        CFBundleDisplayName: Verdure
        NSLocationWhenInUseUsageDescription: "Verdure uses your location to find nearby events and outdoor places you can check in to."
        UIAppFonts:
          - Fredoka-Regular.ttf
          - Fredoka-Medium.ttf
          - Fredoka-SemiBold.ttf
          - Fredoka-Bold.ttf
          - Rubik-Light.ttf
          - Rubik-Regular.ttf
          - Rubik-Medium.ttf
          - Rubik-SemiBold.ttf
          - Rubik-Bold.ttf
        SerpApiKey: $(SERPAPI_KEY)
        TicketmasterKey: $(TICKETMASTER_KEY)
        SeatGeekClientId: $(SEATGEEK_CLIENT_ID)
        NpsApiKey: $(NPS_API_KEY)
        RecreationGovKey: $(RECREATION_GOV_KEY)
        EventbriteToken: $(EVENTBRITE_TOKEN)
        EventbriteOrgId: $(EVENTBRITE_ORG_ID)
        LocalistHost: $(LOCALIST_HOST)
        GooglePSEKey: $(GOOGLE_PSE_KEY)
        GooglePSECx: $(GOOGLE_PSE_CX)
        NeighborhoodCommonsBase: $(NEIGHBORHOOD_COMMONS_BASE)
        NeighborhoodCommonsKey: $(NEIGHBORHOOD_COMMONS_KEY)
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: com.vaiybhav.verdure
      ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
      SWIFT_STRICT_CONCURRENCY: minimal
    dependencies:
      - package: Firebase
        product: FirebaseAuth
      - package: Firebase
        product: FirebaseFirestore
      - package: Firebase
        product: FirebaseFunctions
schemes:
  Verdure:
    build:
      targets:
        Verdure: all
    run:
      config: Debug
      # Local StoreKit testing for Verdure+ subscriptions (no App Store Connect needed
      # in the simulator). Remove this line to test against real ASC products.
      storeKitConfiguration: Verdure.storekit
    test:
      config: Debug
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release
