name: Verdure
options:
  bundleIdPrefix: com.verdure
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "16.3"
configFiles:
  Debug: Secrets.xcconfig
  Release: Secrets.xcconfig
settings:
  SWIFT_VERSION: "6.0"
  MARKETING_VERSION: "1.0.0"
  CURRENT_PROJECT_VERSION: "1"
packages:
  Firebase:
    url: https://github.com/firebase/firebase-ios-sdk
    from: "11.0.0"
targets:
  Verdure:
    type: application
    platform: iOS
    sources:
      - Verdure
    info:
      path: Verdure/Info.plist
      properties:
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UILaunchScreen: {}
        UISupportedInterfaceOrientations~iphone:
          - UIInterfaceOrientationPortrait
        UIRequiresFullScreen: true
        CFBundleDisplayName: Verdure
        NSLocationWhenInUseUsageDescription: "Verdure uses your location to find nearby events and outdoor places you can check in to."
        UIAppFonts:
          - Fredoka-Regular.ttf
          - Fredoka-Medium.ttf
          - Fredoka-SemiBold.ttf
          - Fredoka-Bold.ttf
          - Rubik-Light.ttf
          - Rubik-Regular.ttf
          - Rubik-Medium.ttf
          - Rubik-SemiBold.ttf
          - Rubik-Bold.ttf
        SerpApiKey: $(SERPAPI_KEY)
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: com.vaiybhav.verdure
      ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
      SWIFT_STRICT_CONCURRENCY: minimal
    dependencies:
      - package: Firebase
        product: FirebaseAuth
      - package: Firebase
        product: FirebaseFirestore
