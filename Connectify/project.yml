name: Connectify
options:
  bundleIdPrefix: com.connectify
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "16.3"
configFiles:
  Debug: Secrets.xcconfig
  Release: Secrets.xcconfig
settings:
  SWIFT_VERSION: "6.0"
  MARKETING_VERSION: "1.0.0"
  CURRENT_PROJECT_VERSION: "1"
packages:
  Firebase:
    url: https://github.com/firebase/firebase-ios-sdk
    from: "11.0.0"
targets:
  Connectify:
    type: application
    platform: iOS
    sources:
      - Connectify
    info:
      path: Connectify/Info.plist
      properties:
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UILaunchScreen: {}
        UISupportedInterfaceOrientations~iphone:
          - UIInterfaceOrientationPortrait
        UIRequiresFullScreen: true
        CFBundleDisplayName: Connectify
        NSLocationWhenInUseUsageDescription: "Connectify uses your location to find nearby events and places you can check in to."
        SerpApiKey: $(SERPAPI_KEY)
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: com.vaiybhav.connectify
      ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
      SWIFT_STRICT_CONCURRENCY: minimal
    dependencies:
      - package: Firebase
        product: FirebaseAuth
      - package: Firebase
        product: FirebaseFirestore
